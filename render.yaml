services:
  - type: web
    name: esportify-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # Set manually in Render dashboard — never commit this
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard — never commit this
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel URL after deploying frontend
